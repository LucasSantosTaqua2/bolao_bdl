<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Entrar</h3>

    <div *ngIf="apiMessage" class="alert mb-3" [ngClass]="{'alert-success': isSuccess, 'alert-danger': !isSuccess}">
      {{ apiMessage }}
    </div>

    <form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm"> <div class="mb-3">
        <label for="username" class="form-label">Usuário</label>
        <input
          type="text"
          id="username"
          class="form-control"
          required
          [(ngModel)]="username"
          name="username"
          #usernameField="ngModel" />
        <div *ngIf="usernameField.invalid && (usernameField.dirty || usernameField.touched)" class="text-danger mt-1">
          <div *ngIf="usernameField.errors?.['required']">Usuário é obrigatório.</div>
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <div class="input-group">
          <input
            [type]="passwordFieldType"
            id="password"
            class="form-control"
            required
            [(ngModel)]="password"
            name="password"
            #passwordField="ngModel" />
          <button
            class="btn btn-outline-secondary"
            type="button"
            (click)="togglePasswordVisibility()"
            title="Mostrar/Esconder senha"
          >
            <i class="bi" [ngClass]="{'bi-eye-fill': !showPassword, 'bi-eye-slash-fill': showPassword}"></i>
          </button>
        </div>
        <div *ngIf="passwordField.invalid && (passwordField.dirty || passwordField.touched)" class="text-danger mt-1">
          <div *ngIf="passwordField.errors?.['required']">Senha é obrigatória.</div>
        </div>
      </div>
      <button type="submit" class="btn btn-dark w-100" [disabled]="loginForm.invalid">Entrar</button> </form>
    <hr class="my-4">
    <!-- <p class="text-center">Sou novo por aqui! <a routerLink="/register">Registre-se</a></p> -->
  </div>
</div>
