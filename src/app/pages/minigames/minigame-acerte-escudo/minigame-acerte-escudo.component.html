<div class="minigame-container">
  <ng-container *ngIf="gameInProgress; else gameFinished">
    <div class="header">
      <h1>Acerte o Escudo</h1>
      <p>O escudo de qual time é este?</p>
      <h2 class="team-name-question">{{ currentQuestionTeamName }}</h2>
    </div>

    <div class="emblem-options-grid">
      <div *ngFor="let option of emblemOptions"
           class="emblem-option"
           [class.disabled]="gameLocked"
           (click)="!gameLocked && selectEmblem(option)">
        <img [src]="'assets/images/emblems/' + option.emblemUrl"
             [alt]="option.teamName"
             [style.clip-path]="option.clipPathStyle"
             onError="this.src='assets/images/emblems/default.png'">
      </div>
    </div>

    <div class="stats">
      <span>Pontuação: {{ score }}</span>
      <span>Tentativas: {{ attempts }}</span>
    </div>

    <div *ngIf="feedbackMessage" class="feedback-message" [ngClass]="{'alert-success': isCorrectAnswer, 'alert-danger': !isCorrectAnswer}">
      {{ feedbackMessage }}
    </div>
  </ng-container>

  <ng-template #gameFinished>
    <div class="game-over-container">
      <h2>Fim de Jogo!</h2>
      <p>Sua pontuação final foi: <strong>{{ score }}</strong> em <strong>{{ attempts }}</strong> tentativas.</p>
      <button (click)="restartGame()" class="btn-restart">Jogar Novamente</button>
      <a routerLink="/minigames" class="btn-back">Voltar</a>
    </div>
  </ng-template>
</div>
