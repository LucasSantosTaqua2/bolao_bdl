<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
      <h3 class="text-center mb-4">Registro</h3>
      <form (ngSubmit)="onSubmit(registerForm)" #registerForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Usuário</label>
          <input
            type="text"
            id="username"
            class="form-control"
            required
            [(ngModel)]="username"
            name="username"
            #usernameField="ngModel"
          />
          <div *ngIf="usernameField.invalid && (usernameField.dirty || usernameField.touched)" class="text-danger mt-1">
            <div *ngIf="usernameField.errors?.['required']">Usuário é obrigatório.</div>
          </div>
        </div>
  
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <input
              [type]="passwordFieldType"
              id="password"
              class="form-control"
              required
              [(ngModel)]="password"
              name="password"
              #passwordField="ngModel"
              appPasswordComplexity
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              (click)="togglePasswordVisibility('password')"
              title="Mostrar/Esconder senha"
            >
              <i class="bi" [ngClass]="{'bi-eye-fill': !showPassword, 'bi-eye-slash-fill': showPassword}"></i>
            </button>
          </div>
          <div *ngIf="passwordField.invalid && (passwordField.dirty || passwordField.touched)" class="text-danger mt-1">
            <div *ngIf="passwordField.errors?.['required']">Senha é obrigatória.</div>
            <div *ngIf="passwordField.errors?.['minlength']">Mínimo de 8 caracteres.</div>
            <div *ngIf="passwordField.errors?.['hasUppercase']">Pelo menos uma letra maiúscula.</div>
            <div *ngIf="passwordField.errors?.['hasSpecialCharacter']">Pelo menos um caracter especial.</div>
          </div>
        </div>
  
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar Senha</label>
          <div class="input-group">
            <input
              [type]="confirmPasswordFieldType"
              id="confirmPassword"
              class="form-control"
              required
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              #confirmPasswordField="ngModel"
              [appPasswordMatch]="'password'"
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              (click)="togglePasswordVisibility('confirmPassword')"
              title="Mostrar/Esconder confirmação de senha"
            >
              <i class="bi" [ngClass]="{'bi-eye-fill': !showConfirmPassword, 'bi-eye-slash-fill': showConfirmPassword}"></i>
            </button>
          </div>
          <div *ngIf="confirmPasswordField.invalid && (confirmPasswordField.dirty || confirmPasswordField.touched)" class="text-danger mt-1">
            <div *ngIf="confirmPasswordField.errors?.['required']">Confirmação de senha é obrigatória.</div>
            <div *ngIf="confirmPasswordField.errors?.['passwordMismatch']">As senhas não coincidem.</div>
          </div>
        </div>
  
        <button type="submit" class="btn btn-dark w-100" [disabled]="registerForm.invalid">Registrar</button>
      </form>

      <hr class="my-4"> <p class="text-center">Já tenho uma conta ! <a routerLink="/login">Entrar</a></p>
    </div>
  </div>
